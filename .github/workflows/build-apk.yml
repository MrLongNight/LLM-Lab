name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LLM Lab Standalone,O=MrLongNight,C=DE"
          fi

      - name: Install Vulkan build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libvulkan-dev spirv-headers

      - name: Accept Android SDK Licenses and Install NDK/CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_HOME and ANDROID_SDK_ROOT are both unset."
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found at $SDKMANAGER"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$SDK_ROOT/licenses"
          cat > "$SDK_ROOT/licenses/android-sdk-license" <<'LICENSES'
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          d56f5187479451eabf01fb78af6dfcb131a6481e
          8933bad161af4178b1185d1a37fbf41ea5269c55
          LICENSES
          echo "84831b9409646a245e303448c1ec612ab0ec86a9" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          echo "601085b94cd77f0b54ff86406955d9941874fe0f" > "$SDK_ROOT/licenses/android-googletv-license"
          echo "859f317696e3f23621d44d423c8b623a32246152" > "$SDK_ROOT/licenses/android-sdk-arm-dbt-license"
          echo "25884f5d56b029b114e7f7ac690f6641e23a30dc" > "$SDK_ROOT/licenses/google-gdk-license"
          echo "e9acab587ff1b6049bfac544f7c2203d1744354e" > "$SDK_ROOT/licenses/mips-android-sysimage-license"

          "$SDKMANAGER" --licenses
          "$SDKMANAGER" "ndk;30.0.16248370" "cmake;3.31.6"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Run Unit and Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace

      - name: Compile device acceptance tests
        run: ./gradlew assembleDebugAndroidTest --no-daemon --no-configuration-cache --stacktrace

      - name: Verify packaged native backends
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/llmlab-apk-files.txt"
          grep -Eq 'lib/arm64-v8a/libllmlab_native[.]so$' "$RUNNER_TEMP/llmlab-apk-files.txt"
          grep -Eq 'lib/arm64-v8a/libggml-cpu[^/]*[.]so$' "$RUNNER_TEMP/llmlab-apk-files.txt"
          grep -Eq 'lib/arm64-v8a/libggml-vulkan[^/]*[.]so$' "$RUNNER_TEMP/llmlab-apk-files.txt"
          grep -Eq 'lib/x86_64/libllmlab_native[.]so$' "$RUNNER_TEMP/llmlab-apk-files.txt"
          python3 - "$APK" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              entries = {item.filename: item for item in archive.infolist()}
              required_groups = {
                  "llmlab JNI": [name for name in entries if name == "lib/arm64-v8a/libllmlab_native.so"],
                  "CPU backend": [name for name in entries if name.startswith("lib/arm64-v8a/libggml-cpu") and name.endswith(".so")],
                  "Vulkan backend": [name for name in entries if name == "lib/arm64-v8a/libggml-vulkan.so"],
              }
              for label, names in required_groups.items():
                  if not names:
                      raise SystemExit(f"Missing {label} library in APK")
                  for name in names:
                      if entries[name].compress_type != zipfile.ZIP_DEFLATED:
                          raise SystemExit(f"{label} library is not compressed for Android extraction: {name}")
          print("Native JNI/CPU/Vulkan libraries are compressed for extraction into nativeLibraryDir.")
          PY
          echo "Runtime CPU variants and Vulkan backend are packaged and extractable."

      - name: Prepare Standalone APK Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LLM-Lab-Standalone-debug.apk

      - name: Upload Standalone Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LLM-Lab-Standalone-Debug-APK
          path: dist/LLM-Lab-Standalone-debug.apk
          retention-days: 30
          if-no-files-found: error
