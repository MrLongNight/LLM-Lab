name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Prepare Environment and Keystore
        run: |
          touch .env
          if [ -f "debug.keystore.base64" ]; then
            echo "Stelle debug.keystore aus debug.keystore.base64 wieder her..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Erzeuge neuen debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Accept Android SDK Licenses and Install NDK/CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_HOME and ANDROID_SDK_ROOT are both unset."
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found at $SDKMANAGER"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$SDK_ROOT/licenses"
          cat > "$SDK_ROOT/licenses/android-sdk-license" <<'LICENSES'
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          d56f5187479451eabf01fb78af6dfcb131a6481e
          8933bad161af4178b1185d1a37fbf41ea5269c55
          LICENSES
          printf '%s\\n' "84831b9409646a245e303448c1ec612ab0ec86a9" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf '%s\\n' "601085b94cd77f0b54ff86406955d9941874fe0f" > "$SDK_ROOT/licenses/android-googletv-license"
          printf '%s\\n' "859f317696e3f23621d44d423c8b623a32246152" > "$SDK_ROOT/licenses/android-sdk-arm-dbt-license"
          printf '%s\\n' "25884f5d56b029b114e7f7ac690f6641e23a30dc" > "$SDK_ROOT/licenses/google-gdk-license"
          printf '%s\\n' "e9acab587ff1b6049bfac544f7c2203d1744354e" > "$SDK_ROOT/licenses/mips-android-sysimage-license"

          "$SDKMANAGER" --licenses
          "$SDKMANAGER" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LLM-Lab-Standalone-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LLM-Lab-Standalone-Debug-APK
          path: dist/LLM-Lab-Standalone-debug.apk
          retention-days: 30
          if-no-files-found: error
